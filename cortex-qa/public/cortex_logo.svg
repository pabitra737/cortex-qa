<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180" width="500" height="180">
  <rect width="500" height="180" fill="none"/>

  <!-- Outer circle -->
  <circle cx="88" cy="90" r="62" fill="none" stroke="#1a4f8c" stroke-width="2.2"/>

  <!-- Outer triangle: Top(88,28) BR(141.7,118) BL(34.3,118) -->
  <polygon points="88,28 141.7,118 34.3,118"
    fill="none" stroke="#1a4f8c" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Inner triangle: Top(88,54) BR(116.4,108) BL(59.6,108) -->
  <polygon points="88,54 116.4,108 59.6,108"
    fill="none" stroke="#1a4f8c" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- 3 lines connecting inner vertices to corresponding outer vertices -->
  <!-- Top inner (88,54) → Top outer (88,28) -->
  <line x1="88" y1="54" x2="88" y2="28" stroke="#1a4f8c" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Bottom-right inner (116.4,108) → Bottom-right outer (141.7,118) -->
  <line x1="116.4" y1="108" x2="141.7" y2="118" stroke="#1a4f8c" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Bottom-left inner (59.6,108) → Bottom-left outer (34.3,118) -->
  <line x1="59.6" y1="108" x2="34.3" y2="118" stroke="#1a4f8c" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Node dots at outer triangle vertices -->
  <circle cx="88"    cy="28"  r="6.5" fill="#1a4f8c"/>
  <circle cx="141.7" cy="118" r="6.5" fill="#1a4f8c"/>
  <circle cx="34.3"  cy="118" r="6.5" fill="#1a4f8c"/>

  <!-- Center eye -->
  <circle cx="88" cy="88" r="17" fill="#d6e8f8"/>
  <circle cx="88" cy="88" r="12" fill="#6aaee0"/>
  <circle cx="88" cy="88" r="7"  fill="#1a4f8c"/>
  <circle cx="88" cy="88" r="2.8" fill="#ffffff"/>

  <!-- Wordmark -->
  <text x="172" y="100"
    font-family="'Gill Sans','Trebuchet MS','Calibri',sans-serif"
    font-size="52" font-weight="700" fill="#1a4f8c" letter-spacing="-0.5">cortex</text>
  <text x="174" y="122"
    font-family="'Gill Sans','Trebuchet MS','Calibri',sans-serif"
    font-size="12.5" font-weight="500" fill="#1a4f8c" letter-spacing="4">BY VIREON</text>
</svg>