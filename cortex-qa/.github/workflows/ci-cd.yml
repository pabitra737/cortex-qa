name: CORTEX-QA CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: cortex-qa/package-lock.json

      - name: Install dependencies
        run: |
          cd cortex-qa
          npm ci --legacy-peer-deps

      - name: Run ESLint
        run: |
          cd cortex-qa
          npm run lint

      - name: Run Build
        run: |
          cd cortex-qa
          npm run build
